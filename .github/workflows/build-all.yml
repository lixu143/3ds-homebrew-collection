name: Build all 3DS projects

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user root
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Add devkitPro tools to PATH
        run: |
          echo "$DEVKITARM/bin" >> $GITHUB_PATH
          echo "$DEVKITPRO/tools/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          arm-none-eabi-gcc --version | head -n 1

      - name: Install extra 3DS libraries
        run: |
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          # Core libs (libctru/citro3d/citro2d/3dstools) are preinstalled in the image.
          # Portlibs use inconsistent package names across repos - try each candidate.
          PAC=$(command -v dkp-pacman || command -v pacman || true)
          if [ -n "$PAC" ]; then
            $PAC -S --noconfirm --needed 3ds-dev 3dstools || true
            for pkg in 3ds-libjpeg libjpeg jpeg; do
              $PAC -S --noconfirm --needed "$pkg" 2>/dev/null && break || true
            done
            for pkg in 3ds-libcurl libcurl curl; do
              $PAC -S --noconfirm --needed "$pkg" 2>/dev/null && break || true
            done
            $PAC -S --noconfirm --needed 3ds-mbedtls 2>/dev/null || true
          fi
          # makerom is NOT part of devkitPro. It belongs to the separate
          # Project_CTR repo, and the modern devkitarm image no longer ships it.
          # Download the prebuilt Ubuntu x86_64 binary from GitHub Releases:
          # GitHub Actions runners reach releases.githubusercontent.com directly,
          # so this is unaffected by any local-network/Cloudflare blocking.
          MRO=$(command -v makerom 2>/dev/null || true)
          if [ -z "$MRO" ]; then
            for c in /opt/devkitpro/tools/bin/makerom /opt/devkitpro/bin/makerom /usr/local/bin/makerom; do
              [ -x "$c" ] && MRO="$c" && break
            done
          fi
          if [ -z "$MRO" ]; then
            echo "=== downloading prebuilt makerom from Project_CTR ==="
            # Newer builds need a newer glibc than the devkitarm image provides;
            # try newest first, fall back to older builds that still run here.
            for ver in v0.19.0 v0.18.4 v0.18.3 v0.18.2 v0.18.1; do
              rm -rf /tmp/makerom /tmp/makerom.zip
              if curl -fsSL --retry 2 -o /tmp/makerom.zip \
                "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-$ver/makerom-$ver-ubuntu_x86_64.zip"; then
                mkdir -p /tmp/makerom && unzip -o /tmp/makerom.zip -d /tmp/makerom >/dev/null 2>&1 || true
                CAND=$(find /tmp/makerom -type f -name makerom 2>/dev/null | head -1)
                if [ -n "$CAND" ]; then
                  chmod +x "$CAND"
                  if ! "$CAND" 2>&1 | grep -q "GLIBC_"; then
                    MRO="$CAND"; echo "makerom $ver is compatible"; break
                  else
                    echo "makerom $ver needs newer glibc, trying older..."
                  fi
                fi
              fi
            done
          fi
          echo "MAKEROM_BIN=${MRO:-makerom}" >> $GITHUB_ENV
          echo "makerom => ${MRO:-not found (CIA jobs will skip)}"

      - name: Build NFC Toolbox
        working-directory: ./nfc-toolbox-3ds
        continue-on-error: true
        run: |
          make clean || true
          make -j2

      - name: Upload NFC Toolbox
        uses: actions/upload-artifact@v4
        with:
          name: nfc-toolbox-3ds
          path: nfc-toolbox-3ds/build/*.3dsx
          if-no-files-found: warn

      - name: Build PS5 Stream
        working-directory: ./ps5-stream-3ds
        continue-on-error: true
        run: |
          make clean || true
          make -j2

      - name: Upload PS5 Stream
        uses: actions/upload-artifact@v4
        with:
          name: ps5-stream-3ds
          path: ps5-stream-3ds/*.3dsx
          if-no-files-found: warn

      - name: Build HTTP Share app
        working-directory: ./http-share-3ds/app
        continue-on-error: true
        run: |
          make clean || true
          make -j2

      - name: Upload HTTP Share app
        uses: actions/upload-artifact@v4
        with:
          name: httpshare-app-3dsx
          path: http-share-3ds/app/*.3dsx
          if-no-files-found: warn

      - name: Build HTTP Share sysmodule
        working-directory: ./http-share-sysmodule
        continue-on-error: true
        run: |
          make clean || true
          make -j2

      - name: Upload sysmodule CIAs
        uses: actions/upload-artifact@v4
        with:
          name: httpshare-cia
          path: |
            http-share-sysmodule/module/*.cia
            http-share-sysmodule/launcher/*.cia
          if-no-files-found: warn

      # IPTV needs a 3DS FFmpeg build at iptv-3ds/library/FFmpeg.
      # The 3GX plugin needs libctrpf from a third-party repo.
      # Both are skipped here; build them in their own repos if you add those deps.
