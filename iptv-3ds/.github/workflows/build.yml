name: Build IPTV 3DS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user root
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          arm-none-eabi-gcc --version | head -n 1

      - name: Install extra 3DS libraries
        run: |
          if command -v dkp-pacman >/dev/null 2>&1; then
            dkp-pacman -S --noconfirm --needed 3ds-dev 3ds-libcurl 3ds-mbedtls || true
          elif command -v pacman >/dev/null 2>&1; then
            pacman -S --noconfirm --needed 3ds-dev 3ds-libcurl 3ds-mbedtls || true
          fi

      # This project needs a 3DS build of FFmpeg (ThirdTube / Video player for 3DS branch)
      # placed at library/FFmpeg. Standard devkitPro does NOT ship 3ds-ffmpeg.
      - name: Build .3dsx (requires external FFmpeg port)
        continue-on-error: true
        run: |
          if [ ! -d library/FFmpeg ]; then
            echo "::warning::library/FFmpeg not found - skipping. Add a 3DS FFmpeg build to enable this job."
            exit 0
          fi
          make clean || true
          make -j2

      - name: Upload homebrew
        uses: actions/upload-artifact@v4
        with:
          name: iptv-3ds
          path: ./*.3dsx
          if-no-files-found: warn
